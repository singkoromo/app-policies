<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Policies — singkoromo</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --bg2: #4a236e;
      --card: #ffffff;
      --text: #1f2433;
      --muted: #6b7384;
      --accent: #ffc857;
      --link: #4f7cff;
      --link-hover: #2e5cff;
      --border: #e6e8ee;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI",
                   "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 56px 24px 80px;
    }
    header {
      color: #fff;
      text-align: center;
      margin-bottom: 36px;
    }
    header h1 {
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: 0.01em;
    }
    header p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 15px;
    }
    .accent-line {
      width: 64px;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      margin: 14px auto 0;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .app-card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px 26px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .app-card h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 700;
    }
    .app-card .desc {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .links a {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--link);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
    .links a:hover {
      background: #f5f7ff;
      border-color: var(--link);
      color: var(--link-hover);
    }
    footer {
      margin-top: 48px;
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
    }
    footer a { color: rgba(255, 255, 255, 0.78); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>App Policies</h1>
      <p>各アプリのプライバシーポリシー・利用規約一覧</p>
      <div class="accent-line"></div>
    </header>

    <main>
      <article class="app-card">
        <h2>語源でマスター！英単語帳</h2>
        <p class="desc">語源から覚える英単語学習アプリ (Etymology English)</p>
        <div class="links">
          <a href="etymology-english/privacy.html">プライバシーポリシー</a>
          <a href="etymology-english/terms.html">利用規約</a>
        </div>
      </article>

      <article class="app-card">
        <h2>冒険しながら学ぶ世界史</h2>
        <p class="desc">地図とタイムラインで世界史を旅する学習アプリ (World History)</p>
        <div class="links">
          <a href="world-history/privacy.html">プライバシーポリシー</a>
          <a href="world-history/terms.html">利用規約</a>
        </div>
      </article>
    </main>

    <footer>
      <p>© singkoromo · Hosted on <a href="https://github.com/singkoromo/app-policies">GitHub</a></p>
    </footer>
  </div>
</body>
</html>
